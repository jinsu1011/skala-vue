<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <!-- viewport-fit=cover: 아이폰 노치/홈바 영역까지 화면을 꽉 채웁니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- 📲 PWA: 주소창/상태바 색상 및 홈 화면 추가 관련 메타 태그 -->
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="3D 지구본으로 보는 실시간 도시 날씨 · 24시간/10일 예보">
    <!-- iOS에서 홈 화면 아이콘으로 실행 시 전체 화면 앱처럼 보이게 합니다 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SKALA Weather">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <title>SKALA Weather Globe — 3D 지구본 날씨</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
